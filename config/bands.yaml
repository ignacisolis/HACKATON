# config/bands.yaml
#
# Las 102 bandas de SPHEREx: 6 detectores x 17 canales.
#
# GENERADO: no editar a mano. Se regenera con:
#     python core/make_bands.py
#
# Numeradas de 1 a 102 por longitud de onda creciente. Esta es la
# convencion del proyecto, y es la que responde la pregunta abierta de
# contracts/api.md sobre como se numeran las bandas.
#
# EL ESPACIADO ES LOGARITMICO, NO LINEAL
# SPHEREx es un espectrometro de poder resolvente constante, asi que el
# ancho de banda crece con la longitud de onda. Medido en 6 exposiciones
# reales consecutivas de D2: lambda iba 1.4017 a 1.5806 um y el ancho de
# 0.0336 a 0.0383, con lambda/ancho constante en ~41.4, que es justo el
# resolving power que publica IRSA. El cociente entre lambdas
# consecutivas tambien es constante, 1.0244 = 1 + 1/41.4.
#
# Por eso el centro de cada banda es el centro GEOMETRICO de sus bordes,
# no el aritmetico.
#
# CUANTOS CANALES POR DETECTOR
# Con R constante caben ln(hi/lo)/ln(1+1/R) canales en cada detector:
#     D1: 16.00
#     D2: 16.86
#     D3: 16.49
#     D4: 16.66
#     D5: 16.86
#     D6: 16.31
# Entre 16.0 y 16.9, consistente con 17 dentro de la precision de los
# bordes que publica IRSA. Se usa 17, que es el numero oficial y el que
# da 102 exacto.

