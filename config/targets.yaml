# config/targets.yaml
#
# Astrometria de los 4 objetivos de prueba del hackathon, mas los objetos
# de contexto que caen en el mismo recorte.
#
# GENERADO: no editar a mano. Se regenera con:
#     python core/fetch_targets.py
#
# Fuente de los numeros: SIMBAD (tabla basic) via TAP, mirror de Harvard.
# Las coordenadas de SIMBAD estan en ICRS a epoca J2000.0. El movimiento
# propio va en mas/ano, con pm_ra_cosdec ya multiplicado por cos(dec).
#
# POR QUE ESTE ARCHIVO EXISTE
# Las coordenadas del enunciado son de la epoca de descubrimiento. SPHEREx
# observa en 2025-2026. Para WISE 0855 y eps Ind B esa diferencia son ~20
# pixeles de SPHEREx: si se apunta a las coordenadas del enunciado se mide
# cielo vacio. Usar el bloque `positions` o propagar con core/targets.py.
#
# Campos por objeto:
#   astrometry     valores crudos de SIMBAD a epoca J2000
#   positions      posicion propagada al inicio y fin de la ventana SPHEREx
#   pm_correction  required | negligible, segun el umbral de medio pixel
#   sources        bibcode de cada medicion, para citar en la presentacion

schema_version: 1
generated_utc: 2026-11-10T22:05:45Z
generator: core/fetch_targets.py
simbad_endpoint: https://simbad.harvard.edu/simbad/sim-tap/sync
reference_frame: ICRS
coord_epoch: J2000.0
spherex_pixel_arcsec: 6.2
spherex_window: [2025-04-24, 2026-10-02]
