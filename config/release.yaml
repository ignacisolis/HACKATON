# Configuración del release de SPHEREx que usa el backend.
# Pasar a otro release (p. ej. el final) = editar este archivo, sin tocar código (C1).

release:
  # Carpeta del release dentro de la ruta de IRSA: .../data/spherex/<name>/level2/...
  name: qr2
  label: "SPHEREx Quick Release 2"
  # Versiones de procesamiento permitidas (l2b-vNN-AAAA-DDD). Vacío = todas.
  versions: []

irsa:
  tap_url: https://irsa.ipac.caltech.edu/TAP/sync
  data_base_url: https://irsa.ipac.caltech.edu/
  plane_table: spherex.plane
  artifact_table: spherex.artifact
  timeout_s: 180
  # IRSA pide no pasar de ~10 conexiones simultáneas.
  max_workers: 8

cutout:
  default_size_deg: 0.1
  max_size_deg: 0.3

# Mapeo aproximado de las 102 bandas: 6 detectores x 17 canales,
# espaciados en log(λ) dentro del rango de cada detector (R casi constante).
bands:
  channels_per_detector: 17
  detectors_um:
    1: [0.7455, 1.1167]
    2: [1.1033, 1.6499]
    3: [1.6301, 2.4346]
    4: [2.4027, 3.8473]
    5: [3.8113, 4.4300]
    6: [4.4115, 5.0096]

cache:
  dir: cache
