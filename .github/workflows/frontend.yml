# Frontend (rol B, Bruno): tipos + pruebas + build en cada push/PR. **Solo comprueba.**
#
# El despliegue NO pasa por acá: la web se publica en Vercel, que construye desde `vercel.json`
# en la raíz y toma sus variables del panel de Vercel, no de las del repo.
#
# Hubo un job `deploy` que publicaba en GitHub Pages. Se sacó porque Pages nunca se activó en
# el repo y fallaba con 404 en cada push a main, dejando una X roja permanente que además
# bloqueaba proteger main (no se puede exigir un check que nunca pasa). Si algún día se quiere
# Pages de verdad, hay que activarlo en Settings → Pages y volver a poner el job y el paso de
# `upload-pages-artifact``upload-pages-artifact`, más VITE_BASE, que Pages necesita para servir bajo /<repo>/.
#
# Variables del repo (Settings → Secrets and variables → Actions → Variables):
#   VITE_API_BASE       URL pública del backend (ej. https://spherex-api.example.org). Vacía = fixtures.
name: frontend

on:
  push:
    branches: [main, front]
    paths: ['frontend/**', 'contracts/fixtures/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'contracts/fixtures/**', '.github/workflows/frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tipos, pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - name: Build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          # Este build es una comprobación: su salida se descarta. La web que se publica la
          # construye Vercel, con sus propias variables.
          VITE_USE_FIXTURES: ${{ vars.VITE_API_BASE == '' && '1' || '0' }}
        run: npx vite build
