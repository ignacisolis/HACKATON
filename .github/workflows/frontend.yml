# Frontend (rol B, Bruno): tipos + pruebas + build en cada push/PR, y despliegue a GitHub Pages
# cuando entra a main.
#
# OJO: GitHub Pages en un repo PRIVADO necesita un plan pago. Si el repo sigue privado, el job
# `deploy` falla y hay que publicar en otro lado (Vercel/Netlify/Cloudflare Pages) o hacer el repo
# público. Variables del repo (Settings → Secrets and variables → Actions → Variables):
#   VITE_API_BASE       URL pública del backend (ej. https://spherex-api.example.org). Vacía = fixtures.
name: frontend

on:
  push:
    branches: [main, front]
    paths: ['frontend/**', 'contracts/fixtures/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'contracts/fixtures/**', '.github/workflows/frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tipos, pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          # sin backend público todavía, la web publicada usa los fixtures
          VITE_USE_FIXTURES: ${{ vars.VITE_API_BASE == '' && '1' || '0' }}
        run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: frontend/dist

  deploy:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
